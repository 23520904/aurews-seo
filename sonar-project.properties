# SonarQube Analysis Configuration
# Tells SonarQube to treat test folders as tests and exclude them from main source security audits to prevent false positive security hotspots.

sonar.sources=src
sonar.tests=src/__tests__,e2e
sonar.exclusions=src/__tests__/**/*,e2e/**/*,node_modules/**/*,.next/**/*,coverage/**/*,public/**/*,sentry.*config.ts,next.config.ts,aurews-devops-pipeline-v2.html,docs/**/*
