coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
        if_not_found: success
    patch:
      default:
        target: 50%
        threshold: 10%
        if_not_found: success

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

github_checks:
  annotations: true

ignore:
  - "playwright-report/**"
  - "test-results/**"
  - "coverage/**"
  - ".next/**"
  - "node_modules/**"
  - "prisma/migrations/**"
  - "e2e/**"
