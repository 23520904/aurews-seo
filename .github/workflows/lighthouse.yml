name: Lighthouse CI — SEO Health
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Chạy tự động vào lúc 6h sáng thứ Hai hàng tuần
  workflow_dispatch:     # Cho phép bấm nút chạy thủ công bất cứ lúc nào

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Cài đặt thư viện cục bộ (local) theo phiên bản cố định để đảm bảo an toàn bảo mật
      - name: Install Lighthouse CI CLI
        run: npm install @lhci/cli@0.14.0

      # Bước 1: Thu thập dữ liệu (Quét qua các link web thật bạn đã cấu hình trong file json)
      - name: Collect Lighthouse Reports
        run: npx lhci collect
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Bước 2: Tự động đánh giá điểm số (Đọc cấu hình categories:seo tối thiểu 0.95 từ file của bạn)
      # Lệnh này sẽ tự động báo lỗi (Fail Pipeline) nếu web thật bị tụt điểm SEO, Performance dưới mức sàn
      - name: Assert Performance & SEO Thresholds
        run: npx lhci assert

      # Bước 3: Lưu lại báo cáo chi tiết dưới dạng Artifact để bạn tải về xem giao diện trực quan nếu cần
      - name: Upload Lighthouse Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  notify-discord:
    name: Notify Discord
    needs: [lighthouse]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Lighthouse result to Discord
        env:
          DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          NEEDS_JSON: ${{ toJson(needs) }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY" ]; then
            echo "DISCORD_WEBHOOK_DEPLOY is not set. Skipping Discord notification."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          if echo "$NEEDS_JSON" | jq -e 'to_entries[] | select(.value.result == "failure")' > /dev/null; then
            STATUS="FAILED"
            EMOJI="❌"
            COLOR=15158332
          elif echo "$NEEDS_JSON" | jq -e 'to_entries[] | select(.value.result == "cancelled")' > /dev/null; then
            STATUS="CANCELLED"
            EMOJI="⚠️"
            COLOR=16776960
          else
            STATUS="PASSED"
            EMOJI="✅"
            COLOR=3066993
          fi

          JOB_SUMMARY="$(echo "$NEEDS_JSON" | jq -r 'to_entries | map("\(.key): \(.value.result)") | join("\n")')"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            DESCRIPTION="PR: ${PR_TITLE:-No PR title}"
          else
            DESCRIPTION="Commit: ${COMMIT_MESSAGE:-No commit message}"
          fi

          jq -n \
            --arg title "$EMOJI Lighthouse / SEO Check $STATUS" \
            --arg description "$DESCRIPTION" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg event "$EVENT_NAME" \
            --arg run_url "$RUN_URL" \
            --arg jobs "$JOB_SUMMARY" \
            --argjson color "$COLOR" \
            '{
              username: "Aurews Lighthouse",
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $run_url,
                  color: $color,
                  fields: [
                    { name: "Repository", value: $repository, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Actor", value: $actor, inline: true },
                    { name: "Event", value: $event, inline: true },
                    { name: "Commit", value: $sha, inline: true },
                    { name: "Jobs", value: ("```" + $jobs + "```"), inline: false },
                    { name: "Run", value: $run_url, inline: false }
                  ]
                }
              ]
            }' > discord-payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_DEPLOY" || true
