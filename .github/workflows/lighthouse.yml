name: Lighthouse Production Audit

on:
  # Runs every Monday 06:00 Vietnam time (Sunday 23:00 UTC)
  schedule:
    - cron: '0 23 * * 0'

  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to audit'
        required: false
        default: 'https://aurews.id.vn'

concurrency:
  group: lighthouse-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit Production SEO & Performance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve target URL
        id: target
        env:
          INPUT_TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          set -euo pipefail

          TARGET_URL="${INPUT_TARGET_URL:-https://aurews.id.vn}"

          if ! echo "$TARGET_URL" | grep -Eq '^https?://'; then
            echo "Invalid target URL: $TARGET_URL"
            exit 1
          fi

          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "Target URL: $TARGET_URL"

      - name: Check target availability
        run: |
          set -euo pipefail

          TARGET_URL="${{ steps.target.outputs.target_url }}"

          echo "Checking target availability: $TARGET_URL"

          for i in {1..6}; do
            HTTP_CODE="$(curl -s -L -o /dev/null -w "%{http_code}" "$TARGET_URL" 2>/dev/null || true)"
            HTTP_CODE="${HTTP_CODE:-000}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Target is available: $HTTP_CODE"
              exit 0
            fi

            echo "Target not ready. Attempt $i/6. Status: $HTTP_CODE"
            sleep 10
          done

          echo "Target is not available for Lighthouse audit."
          exit 1

      - name: Run Lighthouse CI audit
        id: lighthouse
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          urls: |
            ${{ steps.target.outputs.target_url }}
            ${{ steps.target.outputs.target_url }}/search
            ${{ steps.target.outputs.target_url }}/category/business
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_URL: ${{ steps.target.outputs.target_url }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY" ]; then
            echo "DISCORD_WEBHOOK_DEPLOY is not set. Skipping Discord notification."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          if [ "$LIGHTHOUSE_OUTCOME" = "failure" ]; then
            STATUS="NEEDS REVIEW"
            EMOJI="⚠️"
            COLOR=16776960
          elif [ "$LIGHTHOUSE_OUTCOME" = "cancelled" ]; then
            STATUS="CANCELLED"
            EMOJI="⚠️"
            COLOR=16776960
          else
            STATUS="COMPLETED"
            EMOJI="✅"
            COLOR=3066993
          fi

          DESCRIPTION="Production Lighthouse audit for ${TARGET_URL}"

          jq -n \
            --arg title "$EMOJI $WORKFLOW $STATUS" \
            --arg description "$DESCRIPTION" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg event "$EVENT_NAME" \
            --arg run_url "$RUN_URL" \
            --arg target_url "$TARGET_URL" \
            --arg outcome "$LIGHTHOUSE_OUTCOME" \
            --argjson color "$COLOR" \
            '{
              username: "Aurews Lighthouse",
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $run_url,
                  color: $color,
                  fields: [
                    { name: "Repository", value: $repository, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Actor", value: $actor, inline: true },
                    { name: "Event", value: $event, inline: true },
                    { name: "Commit", value: $sha, inline: true },
                    { name: "Target URL", value: $target_url, inline: false },
                    { name: "Lighthouse outcome", value: $outcome, inline: true },
                    { name: "Report", value: "Check GitHub Actions artifacts / temporary Lighthouse links.", inline: false },
                    { name: "Run", value: $run_url, inline: false }
                  ]
                }
              ]
            }' > discord-payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_DEPLOY" || true