name: CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel stale runs on force-push

jobs:
  # ── 1. VALIDATE ──────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # ── 2. UNIT + INTEGRATION TESTS ──────────────
  test:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./test.db"  # SQLite for unit tests
      NEXTAUTH_SECRET: "test-secret-32-chars-minimum-xyz"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 3. SECURITY ──────────────────────────────
  security:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # full history for trufflehog

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'library'
          exit-code: '0'
          skip-dirs: 'node_modules,.next,coverage,playwright-report,test-results,.cache'

      - name: Fail on CRITICAL fixable vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          vuln-type: 'library'
          exit-code: '1'
          skip-dirs: 'node_modules,.next,coverage,playwright-report,test-results,.cache'

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: 'trivy-results.sarif' }

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Trufflehog secret scan (Push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@f7ff9980e3980dac3fa0ce9a299c5516565a903c # v3.88.13
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: Trufflehog secret scan (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@f7ff9980e3980dac3fa0ce9a299c5516565a903c # v3.88.13
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  # ── 4. BUILD ─────────────────────────────────
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXT_PUBLIC_SITE_URL: "https://aurews.id.vn"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx prisma generate
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ── 5. E2E TESTS ─────────────────────────────
  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      DISABLE_RATE_LIMIT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build app for E2E
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DISABLE_RATE_LIMIT: "true"
      - name: Run E2E
        run: npx playwright test
        env:
          DISABLE_RATE_LIMIT: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
