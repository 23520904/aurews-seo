name: CI - Commit check
on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:     

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel stale runs on force-push

jobs:
  # ── 1. VALIDATE ──────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # ── 2. UNIT + INTEGRATION TESTS ──────────────
  test:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./test.db"  # SQLite for unit tests
      NEXTAUTH_SECRET: "test-secret-32-chars-minimum-xyz"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── 3. SECURITY ──────────────────────────────
  security:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }  # full history for trufflehog

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'library'
          exit-code: '0'
          skip-dirs: 'node_modules,.next,coverage,playwright-report,test-results,.cache'

      - name: Fail on CRITICAL fixable vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          vuln-type: 'library'
          exit-code: '1'
          skip-dirs: 'node_modules,.next,coverage,playwright-report,test-results,.cache'

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: 'trivy-results.sarif' }

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Trufflehog secret scan (Push)
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334 # v3.95.7
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified


  # ── 4. BUILD ─────────────────────────────────
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXT_PUBLIC_SITE_URL: "https://aurews.id.vn"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx prisma generate
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  

  notify-discord:
    name: Notify Discord
    needs: [validate, test, security, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send CI result to Discord
        env:
          DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          NEEDS_JSON: ${{ toJson(needs) }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY" ]; then
            echo "DISCORD_WEBHOOK_DEPLOY is not set. Skipping Discord notification."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          if echo "$NEEDS_JSON" | jq -e 'to_entries[] | select(.value.result == "failure")' > /dev/null; then
            STATUS="FAILED"
            EMOJI="❌"
            COLOR=15158332
          elif echo "$NEEDS_JSON" | jq -e 'to_entries[] | select(.value.result == "cancelled")' > /dev/null; then
            STATUS="CANCELLED"
            EMOJI="⚠️"
            COLOR=16776960
          else
            STATUS="PASSED"
            EMOJI="✅"
            COLOR=3066993
          fi

          JOB_SUMMARY="$(echo "$NEEDS_JSON" | jq -r 'to_entries | map("\(.key): \(.value.result)") | join("\n")')"
          DESCRIPTION="Commit: ${COMMIT_MESSAGE:-Manual workflow run}"

          jq -n \
            --arg title "$EMOJI $WORKFLOW $STATUS" \
            --arg description "$DESCRIPTION" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg event "$EVENT_NAME" \
            --arg run_url "$RUN_URL" \
            --arg jobs "$JOB_SUMMARY" \
            --argjson color "$COLOR" \
            '{
              username: "Aurews CI",
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $run_url,
                  color: $color,
                  fields: [
                    { name: "Repository", value: $repository, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Actor", value: $actor, inline: true },
                    { name: "Event", value: $event, inline: true },
                    { name: "Commit", value: $sha, inline: true },
                    { name: "Jobs", value: ("```" + $jobs + "```"), inline: false },
                    { name: "Run", value: $run_url, inline: false }
                  ]
                }
              ]
            }' > discord-payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_DEPLOY" || true