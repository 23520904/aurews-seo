name: Preview Deployment (PR)
on:
  pull_request:
    branches: [main, develop]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    outputs:
      preview_url: ${{ steps.vercel-preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      # ── 1. DEPLOY LÊN VERCEL PREVIEW ──
      - name: Deploy Preview to Vercel
        id: vercel-preview
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: latest
          working-directory: ./

      # ── 2. ĐƯA LINK PREVIEW LÊN PR TRƯỚC (ĐÃ SỬA: Sửa lỗi cú pháp + Tránh trùng lặp comment) ──
      - name: Comment or Update preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview-url }}";
            const bodyText = `🚀 **Preview URL:** [${previewUrl}](${previewUrl})\n\n⏳ *Smoke tests đang chạy ngầm...*`;
            
            // Tìm xem Bot đã từng bình luận ở PR này chưa
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Preview URL:')
            );
            
            if (botComment) {
              // Nếu có rồi thì cập nhật nội dung
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: bodyText
              });
            } else {
              // Nếu chưa có thì tạo mới hoàn toàn
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: bodyText
              });
            }

      # ── 3. CHẠY SMOKE TEST ──
      - name: Run smoke tests on preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel-preview.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # ── 4. CẬP NHẬT TRẠNG THÁI TEST THÀNH CÔNG VÀO COMMENT CŨ ──
      - name: Update comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview-url }}";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Preview URL:'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `🚀 **Preview URL:** [${previewUrl}](${previewUrl})\n\n✅ **Smoke tests passed hoàn toàn!**`
              });
            }

      # ── 5. CẬP NHẬT TRẠNG THÁI TEST THẤT BẠI VÀO COMMENT CŨ ──
      - name: Update comment on failure
        if: failure() && steps.vercel-preview.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview-url }}";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Preview URL:'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `🚀 **Preview URL:** [${previewUrl}](${previewUrl})\n\n❌ **Smoke tests đã bị thất bại!** Vui lòng kiểm tra lại log hệ thống.`
              });
            }

  notify-discord:
    name: Notify Discord
    needs: [preview]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send preview result to Discord
        env:
          DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          NEEDS_JSON: ${{ toJson(needs) }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY" ]; then
            echo "DISCORD_WEBHOOK_DEPLOY is not set. Skipping Discord notification."
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          if echo "$NEEDS_JSON" | jq -e 'to_entries[] | select(.value.result == "failure")' > /dev/null; then
            STATUS="FAILED"
            EMOJI="❌"
            COLOR=15158332
          elif echo "$NEEDS_JSON" | jq -e 'to_entries[] | select(.value.result == "cancelled")' > /dev/null; then
            STATUS="CANCELLED"
            EMOJI="⚠️"
            COLOR=16776960
          else
            STATUS="PASSED"
            EMOJI="✅"
            COLOR=3066993
          fi

          JOB_SUMMARY="$(echo "$NEEDS_JSON" | jq -r 'to_entries | map("\(.key): \(.value.result)") | join("\n")')"

          DESCRIPTION="PR: ${PR_TITLE:-Preview deployment}"

          jq -n \
            --arg title "$EMOJI $WORKFLOW $STATUS" \
            --arg description "$DESCRIPTION" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "$SHORT_SHA" \
            --arg event "$EVENT_NAME" \
            --arg run_url "$RUN_URL" \
            --arg jobs "$JOB_SUMMARY" \
            --arg preview_url "$PREVIEW_URL" \
            --argjson color "$COLOR" \
            '{
              username: "Aurews Preview",
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $run_url,
                  color: $color,
                  fields: [
                    { name: "Repository", value: $repository, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Actor", value: $actor, inline: true },
                    { name: "Event", value: $event, inline: true },
                    { name: "Commit", value: $sha, inline: true },
                    { name: "Jobs", value: ("```" + $jobs + "```"), inline: false },
                    { name: "Run", value: $run_url, inline: false }
                  ] + (if $preview_url != "" then [{ name: "Preview URL", value: $preview_url, inline: false }] else [])
                }
              ]
            }' > discord-payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_DEPLOY" || true
