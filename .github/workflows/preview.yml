name: Preview Deployment (PR)
on:
  pull_request:
    branches: [main, develop]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    outputs:
      preview_url: ${{ steps.vercel-preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      # ── 1. DEPLOY LÊN VERCEL PREVIEW ──
      - name: Deploy Preview to Vercel
        id: vercel-preview
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: latest
          working-directory: ./

      # ── 2. ĐƯA LINK PREVIEW LÊN PR TRƯỚC (ĐÃ SỬA: Sửa lỗi cú pháp + Tránh trùng lặp comment) ──
      - name: Comment or Update preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview-url }}";
            const bodyText = `🚀 **Preview URL:** [${previewUrl}](${previewUrl})\n\n⏳ *Smoke tests đang chạy ngầm...*`;
            
            // Tìm xem Bot đã từng bình luận ở PR này chưa
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Preview URL:')
            );
            
            if (botComment) {
              // Nếu có rồi thì cập nhật nội dung
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: bodyText
              });
            } else {
              // Nếu chưa có thì tạo mới hoàn toàn
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: bodyText
              });
            }

      # ── 3. CHẠY SMOKE TEST ──
      - name: Run smoke tests on preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel-preview.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # ── 4. CẬP NHẬT TRẠNG THÁI TEST THÀNH CÔNG VÀO COMMENT CŨ ──
      - name: Update comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview-url }}";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Preview URL:'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `🚀 **Preview URL:** [${previewUrl}](${previewUrl})\n\n✅ **Smoke tests passed hoàn toàn!**`
              });
            }

      # ── 5. CẬP NHẬT TRẠNG THÁI TEST THẤT BẠI VÀO COMMENT CŨ ──
      - name: Update comment on failure
        if: failure() && steps.vercel-preview.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview-url }}";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Preview URL:'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `🚀 **Preview URL:** [${previewUrl}](${previewUrl})\n\n❌ **Smoke tests đã bị thất bại!** Vui lòng kiểm tra lại log hệ thống.`
              });
            }

  # ── 6. DISCORD NOTIFICATION ──────────────────
  notify-discord:
    needs: preview
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_DEPLOY: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_DEPLOY" ]; then
            echo "Discord webhook is unconfigured. Skipping notification."
            exit 0
          fi
          
          STATUS="PASSED"
          STATUS_EMOJI="✅"
          
          PREVIEW_RES="${{ needs.preview.result }}"
          
          if [ "$PREVIEW_RES" = "failure" ]; then
            STATUS="FAILED"
            STATUS_EMOJI="❌"
          elif [ "$PREVIEW_RES" = "cancelled" ]; then
            STATUS="CANCELLED"
            STATUS_EMOJI="⚠️"
          fi
          
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PREVIEW_URL="${{ needs.preview.outputs.preview_url }}"
          
          CONTENT=$(jq -n \
            --arg emoji "$STATUS_EMOJI" \
            --arg status "$STATUS" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "$SHORT_SHA" \
            --arg url "$RUN_URL" \
            --arg preview "$PREVIEW_URL" \
            '
            $emoji + " **Preview Deploy " + $status + "**\n" +
            "• **Repository:** " + $repo + "\n" +
            "• **Branch:** " + $branch + "\n" +
            "• **Actor:** " + $actor + "\n" +
            "• **Commit:** `" + $sha + "`\n" +
            "• **Actions Log:** " + $url + "\n" +
            (if $preview != "" then "• **Preview URL:** " + $preview else "")
            '
          )
          
          curl -s -X POST "$DISCORD_WEBHOOK_DEPLOY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$CONTENT" '{content: $content}')" || true
