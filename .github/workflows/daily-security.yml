name: Daily Security Scan
on:
  schedule: [{cron: '0 2 * * *'}]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      # ── 1. KIỂM TRA NPM AUDIT (Đã tối ưu chạy 1 lần) ──
      - name: npm audit
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > audit_results.json || true
          VULN=$(jq '.metadata.vulnerabilities.total // 0' audit_results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit_results.json)
          CRIT=$(jq '.metadata.vulnerabilities.critical // 0' audit_results.json)
          
          echo "VULN_COUNT=$VULN" >> $GITHUB_OUTPUT
          echo "HIGH_COUNT=$HIGH" >> $GITHUB_OUTPUT
          echo "CRIT_COUNT=$CRIT" >> $GITHUB_OUTPUT

      # ── 2. KIỂM TRA TRIVY SCAN ──
      - name: Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy.json'
        continue-on-error: true

      - name: Summarize Trivy results
        id: trivy_summary
        run: |
          CRIT=0
          HIGH=0
          if [ -f trivy.json ]; then
            CRIT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy.json 2>/dev/null || echo 0)
            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy.json 2>/dev/null || echo 0)
          fi
          [ -z "$CRIT" ] && CRIT=0
          [ -z "$HIGH" ] && HIGH=0
          echo "CRIT_COUNT=$CRIT" >> $GITHUB_OUTPUT
          echo "HIGH_COUNT=$HIGH" >> $GITHUB_OUTPUT

      # ── 3. KIỂM TRA UPTIME WEBSITE ──
      - name: Check uptime
        id: uptime
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurews.id.vn)
          SITEMAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurews.id.vn/sitemap.xml)
          NEWS_SITEMAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurews.id.vn/news-sitemap.xml)
          
          echo "HTTP_STATUS=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "SITEMAP_STATUS=$SITEMAP_CODE" >> $GITHUB_OUTPUT
          echo "NEWS_SITEMAP_STATUS=$NEWS_SITEMAP_CODE" >> $GITHUB_OUTPUT

      # ── 4. GỬI ALERT QUA DISCORD NẾU CÓ BẤT KỲ VẤN ĐỀ GÌ ──
      - name: Discord alert if issues
        if: always()
        env:
          DISCORD_WEBHOOK_SECURITY: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
          UPTIME_STATUS: ${{ steps.uptime.outputs.HTTP_STATUS }}
          SITEMAP_STATUS: ${{ steps.uptime.outputs.SITEMAP_STATUS }}
          NEWS_SITEMAP_STATUS: ${{ steps.uptime.outputs.NEWS_SITEMAP_STATUS }}
          NPM_HIGH: ${{ steps.audit.outputs.HIGH_COUNT }}
          NPM_CRIT: ${{ steps.audit.outputs.CRIT_COUNT }}
          TRIVY_HIGH: ${{ steps.trivy_summary.outputs.HIGH_COUNT }}
          TRIVY_CRIT: ${{ steps.trivy_summary.outputs.CRIT_COUNT }}
        run: |
          # Thiết lập mặc định an toàn nếu rỗng
          UPTIME_STATUS="${UPTIME_STATUS:-000}"
          SITEMAP_STATUS="${SITEMAP_STATUS:-000}"
          NEWS_SITEMAP_STATUS="${NEWS_SITEMAP_STATUS:-000}"
          NPM_HIGH="${NPM_HIGH:-0}"
          NPM_CRIT="${NPM_CRIT:-0}"
          TRIVY_HIGH="${TRIVY_HIGH:-0}"
          TRIVY_CRIT="${TRIVY_CRIT:-0}"

          has_issue=0
          MESSAGE="🚨 **Daily Security Alert ($(date +'%d/%m/%Y'))**\n"

          # 1. Kiểm tra Uptime
          if [ "$UPTIME_STATUS" != "200" ]; then
            MESSAGE="${MESSAGE}⚠️ Homepage is DOWN/Error (Status: ${UPTIME_STATUS})\n"
            has_issue=1
          fi

          if [ "$SITEMAP_STATUS" != "200" ]; then
            MESSAGE="${MESSAGE}⚠️ sitemap.xml is DOWN/Error (Status: ${SITEMAP_STATUS})\n"
            has_issue=1
          fi

          if [ "$NEWS_SITEMAP_STATUS" != "200" ]; then
            MESSAGE="${MESSAGE}⚠️ news-sitemap.xml is DOWN/Error (Status: ${NEWS_SITEMAP_STATUS})\n"
            has_issue=1
          fi

          # 2. Kiểm tra NPM Audit
          if [ "$NPM_HIGH" -gt 0 ] || [ "$NPM_CRIT" -gt 0 ]; then
            MESSAGE="${MESSAGE}🔐 **NPM Audit:** ${NPM_CRIT} CRITICAL, ${NPM_HIGH} HIGH vulnerabilities\n"
            has_issue=1
          fi

          # 3. Kiểm tra Trivy Scan
          if [ "$TRIVY_HIGH" -gt 0 ] || [ "$TRIVY_CRIT" -gt 0 ]; then
            MESSAGE="${MESSAGE}🛡️ **Trivy Scan:** ${TRIVY_CRIT} CRITICAL, ${TRIVY_HIGH} HIGH vulnerabilities\n"
            has_issue=1
          fi

          # Thêm link Actions Run
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="${MESSAGE}\n• **Actions Log:** ${RUN_URL}"

          # Phán quyết có gửi hay không
          if [ "$has_issue" -eq 0 ]; then
            echo "No security or uptime issues found. Skip Discord alert."
            exit 0
          fi

          # Nếu có issue nhưng thiếu webhook URL
          if [ -z "$DISCORD_WEBHOOK_SECURITY" ]; then
            echo "Error: DISCORD_WEBHOOK_SECURITY secret is missing but issues were detected."
            exit 1
          fi

          # Tạo payload JSON bằng jq
          payload="$(jq -n --arg content "$MESSAGE" '{content: $content}')"

          # Gửi tin nhắn qua Discord
          echo "Sending alert to Discord..."
          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_SECURITY"
