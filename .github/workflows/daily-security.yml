name: Daily Security Scan
on:
  schedule: [{cron: '0 2 * * *'}]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      # ── 1. KIỂM TRA NPM AUDIT (Đã tối ưu chạy 1 lần) ──
      - name: npm audit
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > audit_results.json || true
          VULN=$(jq '.metadata.vulnerabilities.total // 0' audit_results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit_results.json)
          CRIT=$(jq '.metadata.vulnerabilities.critical // 0' audit_results.json)
          
          echo "VULN_COUNT=$VULN" >> $GITHUB_OUTPUT
          echo "HIGH_COUNT=$HIGH" >> $GITHUB_OUTPUT
          echo "CRIT_COUNT=$CRIT" >> $GITHUB_OUTPUT

      # ── 2. KIỂM TRA TRIVY SCAN ──
      - name: Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy.json'
        continue-on-error: true

      - name: Parse Trivy results
        id: trivy_parse
        run: |
          if [ -f trivy.json ]; then
            CRIT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy.json || echo 0)
            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy.json || echo 0)
          else
            CRIT=0
            HIGH=0
          fi
          echo "CRIT_COUNT=$CRIT" >> $GITHUB_OUTPUT
          echo "HIGH_COUNT=$HIGH" >> $GITHUB_OUTPUT

      # ── 3. KIỂM TRA UPTIME WEBSITE ──
      - name: Check uptime
        id: uptime
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurews.id.vn)
          SITEMAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurews.id.vn/sitemap.xml)
          NEWS_SITEMAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurews.id.vn/news-sitemap.xml)
          
          echo "HTTP_STATUS=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "SITEMAP_STATUS=$SITEMAP_CODE" >> $GITHUB_OUTPUT
          echo "NEWS_SITEMAP_STATUS=$NEWS_SITEMAP_CODE" >> $GITHUB_OUTPUT

      # ── 4. GỬI ALERT QUA DISCORD NẾU CÓ BẤT KỲ VẤN ĐỀ GÌ ──
      - name: Discord alert if issues
        if: |
          always() && (
            (steps.audit.outputs.HIGH_COUNT != '' && fromJSON(steps.audit.outputs.HIGH_COUNT) > 0) || 
            (steps.audit.outputs.CRIT_COUNT != '' && fromJSON(steps.audit.outputs.CRIT_COUNT) > 0) || 
            (steps.trivy_parse.outputs.HIGH_COUNT != '' && fromJSON(steps.trivy_parse.outputs.HIGH_COUNT) > 0) || 
            (steps.trivy_parse.outputs.CRIT_COUNT != '' && fromJSON(steps.trivy_parse.outputs.CRIT_COUNT) > 0) || 
            (steps.uptime.outputs.HTTP_STATUS != '' && steps.uptime.outputs.HTTP_STATUS != '200') ||
            (steps.uptime.outputs.SITEMAP_STATUS != '' && steps.uptime.outputs.SITEMAP_STATUS != '200') ||
            (steps.uptime.outputs.NEWS_SITEMAP_STATUS != '' && steps.uptime.outputs.NEWS_SITEMAP_STATUS != '200')
          )
        env:
          DISCORD_WEBHOOK_SECURITY: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_SECURITY" ]; then
            echo "Discord webhook is unconfigured. Skipping alert."
            exit 0
          fi
          
          UPTIME_STATUS="${{ steps.uptime.outputs.HTTP_STATUS }}"
          SITEMAP_STATUS="${{ steps.uptime.outputs.SITEMAP_STATUS }}"
          NEWS_SITEMAP_STATUS="${{ steps.uptime.outputs.NEWS_SITEMAP_STATUS }}"
          
          NPM_HIGH="${{ steps.audit.outputs.HIGH_COUNT }}"
          NPM_HIGH="${NPM_HIGH:-0}"
          NPM_CRIT="${{ steps.audit.outputs.CRIT_COUNT }}"
          NPM_CRIT="${NPM_CRIT:-0}"
          
          TRIVY_HIGH="${{ steps.trivy_parse.outputs.HIGH_COUNT }}"
          TRIVY_HIGH="${TRIVY_HIGH:-0}"
          TRIVY_CRIT="${{ steps.trivy_parse.outputs.CRIT_COUNT }}"
          TRIVY_CRIT="${TRIVY_CRIT:-0}"
          
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          CONTENT=$(jq -n \
            --arg date "$(date +'%d/%m/%Y')" \
            --arg uptime "$UPTIME_STATUS" \
            --arg sitemap "$SITEMAP_STATUS" \
            --arg news_sitemap "$NEWS_SITEMAP_STATUS" \
            --arg npm_high "$NPM_HIGH" \
            --arg npm_crit "$NPM_CRIT" \
            --arg trivy_high "$TRIVY_HIGH" \
            --arg trivy_crit "$TRIVY_CRIT" \
            --arg url "$RUN_URL" \
            '
            "🚨 **Daily Security Alert (" + $date + ")**\n" +
            (if $uptime != "200" then "⚠️ Homepage is DOWN/Error (Status: " + $uptime + ")\n" else "") +
            (if $sitemap != "200" then "⚠️ sitemap.xml is DOWN/Error (Status: " + $sitemap + ")\n" else "") +
            (if $news_sitemap != "200" then "⚠️ news-sitemap.xml is DOWN/Error (Status: " + $news_sitemap + ")\n" else "") +
            (if ($npm_high | tonumber) > 0 or ($npm_crit | tonumber) > 0 then "🔐 **NPM Audit:** " + $npm_crit + " CRITICAL, " + $npm_high + " HIGH vulnerabilities\n" else "") +
            (if ($trivy_high | tonumber) > 0 or ($trivy_crit | tonumber) > 0 then "🛡️ **Trivy Scan:** " + $trivy_crit + " CRITICAL, " + $trivy_high + " HIGH vulnerabilities\n" else "") +
            "\n• **Actions Log:** " + $url
            '
          )
          
          curl -s -X POST "$DISCORD_WEBHOOK_SECURITY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$CONTENT" '{content: $content}')" || true
